name: 'تقسیم و ارسال هوشمندانه به بله جدید'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت اطلاعات فایل
        id: info
        run: |
          URL="${{ github.event.inputs.link }}"
          FILENAME=$(basename "$URL" | cut -d '?' -f1)
          [ -z "$FILENAME" ] && FILENAME="file.dat"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "نام فایل: $FILENAME"

      - name: اطلاع‌رسانی شروع
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="شروع پردازش فایل: ${{ steps.info.outputs.filename }}"
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage

      - name: دانلود فایل
        run: curl -L -o file.dat "${{ github.event.inputs.link }}"

      - name: تقسیم فایل (۱۸ مگابایتی)
        run: split -b 18M -d -a 3 file.dat part_

      # 🧠 تابع هوشمند با قابلیت تلاش مجدد و لگاریتم پس‌نشین
      - name: ارسال هوشمندانه قطعات با خطایابی
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          # تابع مخصوص ارسال با تلاش مجدد
          send_with_retry() {
            local file=$1
            local max_attempts=5   # حداکثر 5 بار تلاش
            local attempt=1
            local delay=10         # ابتدا 10 ثانیه صبر کن

            while [ $attempt -le $max_attempts ]; do
              echo "تلاش $attempt از $max_attempts برای ارسال $file ..."
              # ارسال فایل و دریافت کد خروج و پاسخ
              response=$(curl -s -w "\n%{http_code}" -F chat_id=${CHAT_ID} -F document=@"${file}" https://tapi.bale.ai/bot${TOKEN}/sendDocument)
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')

              # اگر ارسال موفق بود
              if [ "$http_code" -eq 200 ]; then
                echo "✅ $file با موفقیت ارسال شد."
                return 0
              fi
              
              # بررسی خطای به خصوص 429 (ازدحام سرور بله)
              if [ "$http_code" -eq 429 ]; then
                echo "⚠️ خطای ازدحام سرور! صبر می‌کنم ${delay} ثانیه..."
                sleep $delay
                delay=$((delay * 2))  # دفعه بعد دوبرابر صبر کن
                attempt=$((attempt + 1))
              else
                echo "❌ خطای غیرمنتظره با کد $http_code برای فایل $file"
                echo "جزییات خطا: $body"
                return 1
              fi
            done
            echo "❌ شکست کامل در ارسال $file بعد از $max_attempts بار تلاش"
            return 1
          }

          # حالا این تابع رو روی همه قطعات اجرا کن
          echo "شروع ارسال قطعات با مکانیزم مقاوم..."
          for piece in part_*; do
            send_with_retry "$piece"
            if [ $? -ne 0 ]; then
              echo "اخطار: ارسال $piece ناموفق بود، اما ادامه می‌دهم..."
            fi
            sleep 2  # فاصله استاندارد بین قطعات
          done
          echo "✅ فرآیند ارسال تکمیل شد."

      - name: گزارش نهایی
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="✅ فرآیند ارسال فایل '${{ steps.info.outputs.filename }}' به پایان رسید."
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage
