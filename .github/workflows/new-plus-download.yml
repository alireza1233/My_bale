name: 'تقسیم و ارسال ساده با split (مناسب برای ترکیب با copy /b)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت اطلاعات فایل (حجم و نام)
        id: info
        run: |
          URL="${{ github.event.inputs.link }}"
          RAW_FILENAME=$(basename "$URL" | cut -d '?' -f1)
          [ -z "$RAW_FILENAME" ] && RAW_FILENAME="file"
          echo "raw_filename=$RAW_FILENAME" >> $GITHUB_OUTPUT
          
          # محاسبه تعداد قطعات از روی هدر
          SIZE=$(curl -sI -L "$URL" | grep -i content-length | tail -1 | awk '{print $2}' | tr -d '\r')
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ]; then
            NUM_PARTS=$(( (SIZE + 18*1024*1024 - 1) / (18*1024*1024) ))
          else
            NUM_PARTS="نامشخص"
          fi
          echo "num_parts=$NUM_PARTS" >> $GITHUB_OUTPUT

      - name: اطلاع‌رسانی شروع (همراه با تعداد قطعات)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="📦 فایل: ${{ steps.info.outputs.raw_filename }}\n🔢 تعداد قطعات ۱۸ مگابایتی: ${{ steps.info.outputs.num_parts }}\n⏳ در حال دانلود و تقسیم با split... (قطعات part_000, part_001, ...)"
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage

      - name: دانلود فایل اصلی
        run: curl -L -o original_file.dat "${{ github.event.inputs.link }}"

      - name: تقسیم فایل با split (۱۸ مگابایت، پیشوند part_)
        run: split -b 18M -d -a 3 original_file.dat part_

      - name: ارسال قطعات با تلاش مجدد (تا ۵ بار)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          send_with_retry() {
            local file=$1
            local max_attempts=5
            local attempt=1
            local delay=10
            while [ $attempt -le $max_attempts ]; do
              echo "تلاش $attempt از $max_attempts برای ارسال $file ..."
              response=$(curl -s -w "\n%{http_code}" -F chat_id=${CHAT_ID} -F document=@"${file}" https://tapi.bale.ai/bot${TOKEN}/sendDocument)
              http_code=$(echo "$response" | tail -n1)
              if [ "$http_code" -eq 200 ]; then
                echo "✅ $file با موفقیت ارسال شد."
                return 0
              fi
              if [ "$http_code" -eq 429 ]; then
                echo "⚠️ ازدحام سرور، صبر ${delay} ثانیه..."
                sleep $delay
                delay=$((delay * 2))
                attempt=$((attempt + 1))
              else
                echo "❌ خطا با کد $http_code برای $file"
                return 1
              fi
            done
            echo "❌ شکست بعد از $max_attempts تلاش"
            return 1
          }
          for piece in part_*; do
            send_with_retry "$piece"
            sleep 2
          done

      - name: گزارش نهایی
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          RAW="${{ steps.info.outputs.raw_filename }}"
          TEXT="✅ ارسال قطعات فایل '$RAW' با موفقیت انجام شد.\n\n🔧 برای ترکیب در ویندوز:\ncopy /b part_* \"$RAW\"\n\n(اطمینان حاصل کنید همه قطعات در یک پوشه هستند و به ترتیب عددی part_000 تا part_xxx قرار دارند.)"
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage
