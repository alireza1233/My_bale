name: 'تقسیم و ارسال هوشمندانه به بله (نسخه 7z برای ZArchiver)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت اطلاعات فایل (حجم و نام)
        id: info
        run: |
          URL="${{ github.event.inputs.link }}"
          RAW_FILENAME=$(basename "$URL" | cut -d '?' -f1)
          [ -z "$RAW_FILENAME" ] && RAW_FILENAME="file"
          # نام پایه بدون آخرین پسوند (برای قطعات)
          BASENAME="${RAW_FILENAME%.*}"
          [ -z "$BASENAME" ] && BASENAME="$RAW_FILENAME"
          echo "raw_filename=$RAW_FILENAME" >> $GITHUB_OUTPUT
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT
          
          # محاسبه تعداد قطعات
          SIZE=$(curl -sI -L "$URL" | grep -i content-length | tail -1 | awk '{print $2}' | tr -d '\r')
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ]; then
            NUM_PARTS=$(( (SIZE + 18*1024*1024 - 1) / (18*1024*1024) ))
          else
            NUM_PARTS="نامشخص"
          fi
          echo "num_parts=$NUM_PARTS" >> $GITHUB_OUTPUT

      - name: اطلاع‌رسانی شروع (همراه با تعداد قطعات)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="📦 فایل: ${{ steps.info.outputs.raw_filename }}\n🔢 تعداد قطعات ۱۸ مگابایتی: ${{ steps.info.outputs.num_parts }}\n⏳ در حال دانلود و تقسیم... (قطعات با پسوند .7z ارسال می‌شوند)"
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage

      - name: دانلود فایل اصلی
        run: curl -L -o original_file.dat "${{ github.event.inputs.link }}"

      - name: تقسیم فایل به قطعات ۱۸ مگابایتی
        run: split -b 18M -d -a 3 original_file.dat part_

      - name: تغییر نام قطعات به فرمت "نام اصلی.partXXX.7z"
        run: |
          BASENAME="${{ steps.info.outputs.basename }}"
          if [ -z "$BASENAME" ]; then BASENAME="file"; fi
          for file in part_*; do
            NUMBER=$(echo "$file" | sed 's/part_//')
            mv "$file" "${BASENAME}.part${NUMBER}.7z"
          done

      - name: ارسال هوشمندانه قطعات با تلاش مجدد (تا ۵ بار)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          send_with_retry() {
            local file=$1
            local max_attempts=5
            local attempt=1
            local delay=10
            while [ $attempt -le $max_attempts ]; do
              echo "تلاش $attempt از $max_attempts برای ارسال $file ..."
              response=$(curl -s -w "\n%{http_code}" -F chat_id=${CHAT_ID} -F document=@"${file}" https://tapi.bale.ai/bot${TOKEN}/sendDocument)
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              if [ "$http_code" -eq 200 ]; then
                echo "✅ $file با موفقیت ارسال شد."
                return 0
              fi
              if [ "$http_code" -eq 429 ]; then
                echo "⚠️ خطای ازدحام سرور! صبر می‌کنم ${delay} ثانیه..."
                sleep $delay
                delay=$((delay * 2))
                attempt=$((attempt + 1))
              else
                echo "❌ خطای غیرمنتظره با کد $http_code برای فایل $file"
                echo "جزییات خطا: $body"
                return 1
              fi
            done
            echo "❌ شکست کامل بعد از $max_attempts بار تلاش"
            return 1
          }
          echo "شروع ارسال قطعات..."
          for piece in *.7z; do
            send_with_retry "$piece"
            sleep 2
          done

      - name: گزارش نهایی با آموزش استفاده در اندروید (ZArchiver)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          BASENAME="${{ steps.info.outputs.basename }}"
          RAW="${{ steps.info.outputs.raw_filename }}"
          TEXT="✅ ارسال قطعات فایل '$RAW' با موفقیت انجام شد.\n\n🔧 **نحوه استفاده در اندروید (ZArchiver - پیشنهادی):**\n1. تمام فایل‌های ${BASENAME}.part*.7z را در یک پوشه در گوشی کپی کنید.\n2. اپ ZArchiver را از کافه‌بازار یا گوگل‌پلی نصب کنید.\n3. در ZArchiver به آن پوشه بروید.\n4. روی فایل **${BASENAME}.part000.7z** (اولین قطعه) ضربه بزنید.\n5. گزینه **Extract here** را انتخاب کنید. ZArchiver به‌طور خودکار قطعات را ترکیب و فایل اصلی را خارج می‌کند.\n\n📌 اگر با ZArchiver مشکل داشتید، می‌توانید در ویندوز با دستور copy /b ترکیب کنید.\n🔁 برای ترکیب در ویندوز:\ncopy /b ${BASENAME}.part*.7z \"$RAW\""
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage
