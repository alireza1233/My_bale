name: 'تقسیم و ارسال هوشمندانه به بله (نسخه 7z اصولی)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت اطلاعات فایل (حجم و نام)
        id: info
        run: |
          URL="${{ github.event.inputs.link }}"
          RAW_FILENAME=$(basename "$URL" | cut -d '?' -f1)
          [ -z "$RAW_FILENAME" ] && RAW_FILENAME="file"
          BASENAME="${RAW_FILENAME%.*}"
          [ -z "$BASENAME" ] && BASENAME="$RAW_FILENAME"
          echo "raw_filename=$RAW_FILENAME" >> $GITHUB_OUTPUT
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT

      - name: اطلاع‌رسانی شروع
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="📦 فایل: ${{ steps.info.outputs.raw_filename }}\n⏳ در حال دانلود و ایجاد آرشیو... (قطعات ۱۸ مگابایتی .7z ساخته می‌شوند)"
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage

      - name: دانلود فایل اصلی
        run: |
          # فایل اصلی را دانلود کن
          curl -L -o original_file "${{ github.event.inputs.link }}"
          # پسوند فایل دانلودی را بگیر (مثلاً .zip یا .exe)
          FILENAME=$(basename "${{ github.event.inputs.link }}")
          EXTENSION="${FILENAME##*.}"
          # اگر پسوند معروفی داشت، فایل را در پوشه‌ای به همان نام استخراج کن (برای فایل‌های نصبی مثل exe کار نمی‌کند)
          if [[ "$EXTENSION" == "zip" || "$EXTENSION" == "tar" || "$EXTENSION" == "gz" || "$EXTENSION" == "bz2" ]]; then
            mkdir extracted
            if [[ "$EXTENSION" == "zip" ]]; then
              unzip original_file -d extracted
            else
              tar -xf original_file -C extracted
            fi
            COMPRESS_TARGET="extracted"
          else
            # اگر فایل فشرده نبود (مثل exe یا jar)، خود فایل را به عنوان هدف فشرده‌سازی قرار بده
            COMPRESS_TARGET="original_file"
          fi
          echo "COMPRESS_TARGET=$COMPRESS_TARGET" >> $GITHUB_ENV

      - name: ایجاد آرشیو 7z چندبخشی (هر قطعه ۱۸ مگابایت)
        run: |
          # نصب 7z
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          # ایجاد آرشیو 7z با قطعات ۱۸ مگابایتی
          # با این دستور فایل‌های archive.7z.001, archive.7z.002, ... ساخته می‌شوند
          7z a -v18m -mx0 archive.7z ${{ env.COMPRESS_TARGET }}

      - name: تغییر نام قطعات به فرمت "نام اصلی.partX.7z" (اختیاری)
        run: |
          BASENAME="${{ steps.info.outputs.basename }}"
          if [ -z "$BASENAME" ]; then BASENAME="file"; fi
          COUNTER=1
          # توجه: نام فایل‌های تولیدی 7z به صورت archive.7z.001, archive.7z.002, ... است
          for file in archive.7z.*; do
            mv "$file" "${BASENAME}.part${COUNTER}.7z"
            COUNTER=$((COUNTER + 1))
          done

      - name: ارسال قطعات به بله
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          for piece in *.7z; do
            echo "در حال ارسال $piece ..."
            curl -s -F chat_id=${CHAT_ID} -F document=@"${piece}" https://tapi.bale.ai/bot${TOKEN}/sendDocument
            sleep 2
          done

      - name: گزارش نهایی با آموزش استفاده
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          BASENAME="${{ steps.info.outputs.basename }}"
          RAW="${{ steps.info.outputs.raw_filename }}"
          TEXT="✅ ارسال قطعات فایل '$RAW' با موفقیت انجام شد.\n\n🔧 **نحوه استفاده در اندروید:**\n1. تمام فایل‌های ${BASENAME}.part*.7z را در یک پوشه در گوشی کپی کنید.\n2. اپلیکیشن **ZArchiver** را باز کنید.\n3. به آن پوشه بروید.\n4. روی فایل **${BASENAME}.part1.7z** ضربه بزنید.\n5. گزینه **Extract here** را انتخاب کنید. ZArchiver به‌طور خودکار قطعات را شناسایی کرده و فایل اصلی را خارج می‌کند."
          curl -s -X POST -F chat_id=${CHAT_ID} -F text="${TEXT}" https://tapi.bale.ai/bot${TOKEN}/sendMessage
