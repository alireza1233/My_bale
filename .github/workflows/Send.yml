name: 'دانلود و ارسال به بله'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت اطلاعات فایل (حجم و نام)
        id: info
        run: |
          URL="${{ github.event.inputs.link }}"
          # اسم فایل از آخر لینک
          FILENAME=$(basename "$URL" | cut -d '?' -f1)
          [ -z "$FILENAME" ] && FILENAME="file.dat"
          # گرفتن حجم فایل بدون دانلود کامل
          SIZE=$(curl -sI -L "$URL" | grep -i content-length | tail -1 | awk '{print $2}' | tr -d '\r')
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ]; then
            NUM_PARTS=$(( (SIZE + 18*1024*1024 - 1) / (18*1024*1024) ))
          else
            NUM_PARTS="نامشخص"
          fi
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "num_parts=$NUM_PARTS" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "نام فایل: $FILENAME"
          echo "تعداد قطعات تقریبی: $NUM_PARTS"

      - name: اطلاع‌رسانی به بله (آغاز ارسال)
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="📦 در حال پردازش فایل: ${{ steps.info.outputs.filename }}\n🔢 تعداد قطعات ۱۸ مگابایتی: ${{ steps.info.outputs.num_parts }}\n⏳ لطفاً صبر کنید..."
          curl -s -X POST \
            -F chat_id=${CHAT_ID} \
            -F text="${TEXT}" \
            https://tapi.bale.ai/bot${TOKEN}/sendMessage

      - name: دانلود فایل
        run: curl -L -o file.dat "${{ github.event.inputs.link }}"

      - name: تقسیم به قطعات ۱۸ مگابایتی
        run: split -b 18M -d -a 3 file.dat part_

      - name: ارسال قطعات به بله
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          for piece in part_*; do
            echo "ارسال $piece ..."
            curl -s -F chat_id=${CHAT_ID} -F document=@"${piece}" \
              https://tapi.bale.ai/bot${TOKEN}/sendDocument
            sleep 2
          done

      - name: اطلاع‌رسانی موفقیت
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          TEXT="✅ ارسال همه قطعات با موفقیت انجام شد.\n📁 فایل اصلی: ${{ steps.info.outputs.filename }}\n🔧 برای بازسازی دستور cat یا copy را استفاده کنید."
          curl -s -X POST \
            -F chat_id=${CHAT_ID} \
            -F text="${TEXT}" \
            https://tapi.bale.ai/bot${TOKEN}/sendMessage
