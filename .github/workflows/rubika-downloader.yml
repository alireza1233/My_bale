name: 'ارسال فایل کامل به ربات روبیکا (بدون تقسیم)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: نصب پایتون و کتابخانه rubpy
        run: |
          python -m pip install --upgrade pip
          pip install rubpy aiohttp

      - name: دانلود و ارسال فایل به روبیکا
        env:
          TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          FILE_URL: ${{ github.event.inputs.link }}
        run: |
          python - <<EOF
import asyncio
import aiohttp
import os
from rubpy import Client

async def main():
    token = os.environ['TOKEN']
    chat_id = os.environ['CHAT_ID']
    url = os.environ['FILE_URL']
    
    # استخراج نام فایل از لینک
    filename = url.split('/')[-1].split('?')[0]
    if not filename:
        filename = 'downloaded_file'
    
    print(f"در حال دانلود: {filename}")
    async with aiohttp.ClientSession() as session:
        async with session.get(url) as resp:
            with open(filename, 'wb') as f:
                f.write(await resp.read())
    print("دانلود کامل شد.")
    
    # اتصال به ربات روبیکا و ارسال فایل
    async with Client(name='sender', bot_token=token) as bot:
        print("در حال ارسال فایل به روبیکا...")
        try:
            result = await bot.send_document(
                object_guid=chat_id,
                document=filename,
                caption="🎯 فایل درخواستی شما"
            )
            print("✅ فایل با موفقیت ارسال شد.")
        except Exception as e:
            print(f"❌ خطا در ارسال: {e}")
            raise
    
    # پاک کردن فایل موقت
    os.remove(filename)

if __name__ == "__main__":
    asyncio.run(main())
EOF
