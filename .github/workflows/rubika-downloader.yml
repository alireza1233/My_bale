name: 'ارسال فایل به روبیکا (بدون Caption)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: نصب کتابخانه
        run: pip install rubpy aiohttp

      - name: دانلود و ارسال فایل
        env:
          TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          URL: ${{ github.event.inputs.link }}
        run: |
          python -c "
          import asyncio, aiohttp, os
          from rubpy.bot import BotClient
          async def main():
              token = os.environ['TOKEN']
              chat_id = os.environ['CHAT_ID']
              url = os.environ['URL']
              fname = url.split('/')[-1].split('?')[0] or 'file.bin'
              print('Downloading...')
              async with aiohttp.ClientSession() as s:
                  async with s.get(url) as r:
                      if r.status != 200:
                          print(f'Download error: {r.status}')
                          return
                      with open(fname, 'wb') as f:
                          f.write(await r.read())
              print('Download done')
              bot = BotClient(token)
              await bot.send_file(chat_id, fname)  # <--- ببین، اینجا caption حذف شده
              await bot.close()
              os.remove(fname)
              print('Success')
          asyncio.run(main())
          "
