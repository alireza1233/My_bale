name: 'ارسال فایل به روبیکا (تقسیم ۴۰ مگابایتی)'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود فایل
        env:
          URL: ${{ github.event.inputs.link }}
        run: |
          FILENAME=$(basename "$URL" | cut -d '?' -f1)
          curl -L -o "$FILENAME" "$URL"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: تقسیم و ارسال قطعات ۴۰ مگابایتی
        env:
          TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: |
          FILE="$FILENAME"
          CHUNK_SIZE=$((40 * 1024 * 1024))
          split -b $CHUNK_SIZE "$FILE" part_
          
          PART_NUM=1
          for part in part_*; do
            echo "در حال ارسال قطعه $PART_NUM - $part"
            curl -X POST "https://botapi.rubika.ir/v3/${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@$part"
            echo ""
            PART_NUM=$((PART_NUM + 1))
            sleep 2
          done
          
          rm -f "$FILE" part_*
