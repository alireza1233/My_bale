name: 'ارسال فایل به روبیکا'

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'لینک مستقیم فایل'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: نصب پکیج‌ها
        run: |
          pip install rubpy aiohttp

      - name: اجرا
        env:
          TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          URL: ${{ github.event.inputs.link }}
        run: |
          python -c "
import asyncio, aiohttp, os
from rubpy import Client

async def main():
    token = os.environ['TOKEN']
    chat_id = os.environ['CHAT_ID']
    url = os.environ['URL']
    fname = url.split('/')[-1].split('?')[0] or 'file.bin'
    print('Downloading...')
    async with aiohttp.ClientSession() as s:
        async with s.get(url) as r:
            with open(fname, 'wb') as f:
                f.write(await r.read())
    async with Client(bot_token=token) as bot:
        await bot.send_document(object_guid=chat_id, document=fname, caption='Done')
    os.remove(fname)

asyncio.run(main())
"
