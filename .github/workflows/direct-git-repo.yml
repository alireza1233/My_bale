name: Download file from URL and push to repo

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل (مثلاً لینک دانلود از Release)'
        required: true
      target_folder:
        description: 'پوشه مقصد در مخزن (مثلاً downloads)'
        required: false
        default: 'downloads'
      target_filename:
        description: 'نام فایل در مخزن (اختیاری - اگر خالی بذاری از اسم اصلی لینک میگیره)'
        required: false

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract filename from URL (if not provided)
        id: filename
        run: |
          if [ -n "${{ github.event.inputs.target_filename }}" ]; then
            echo "FILENAME=${{ github.event.inputs.target_filename }}" >> $GITHUB_OUTPUT
          else
            URL="${{ github.event.inputs.file_url }}"
            NAME=$(basename "$URL" | cut -d '?' -f1)
            echo "FILENAME=$NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create target directory
        run: |
          mkdir -p "${{ github.event.inputs.target_folder }}"

      - name: Download file
        run: |
          curl -L -o "${{ github.event.inputs.target_folder }}/${{ steps.filename.outputs.FILENAME }}" \
            "${{ github.event.inputs.file_url }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.target_folder }}/${{ steps.filename.outputs.FILENAME }}"
          git commit -m "Add downloaded file: ${{ steps.filename.outputs.FILENAME }}" || echo "No changes"
          git push
